# Beni JobSearch: critérios de busca e regras de seleção.
# A rotina diária lê este arquivo antes de cada busca.

destinatario: bernardo.claude.bot@gmail.com
horario_envio: "10:00"          # horário de Brasília (America/Sao_Paulo)
dias_envio: segunda a sexta      # sem envio aos sábados e domingos
fuso: America/Sao_Paulo

perfil:
  areas:
    - Desenvolvimento de Software   # back-end, front-end, full stack, mobile, QA/automação
    - Dados                         # análise, engenharia, BI, analytics
    - Inteligência Artificial       # ML, IA, LLM
  nivel: junior                     # aceita "Jr", "Júnior", "Junior", "Trainee"; rejeita pleno/sênior
  modalidade: 100% remoto           # rejeita híbrido e presencial, mesmo que o site marque "remoto"

janela_publicacao_dias: 7

cota_diaria:
  total: 10
  pequenas_medias: 8                # até ~500 funcionários
  grandes: 2                        # mais de ~500 funcionários
  limite_funcionarios_pme: 500

bloco_internacional:
  dia_semana: quinta-feira
  total: 5
  regra: vaga júnior, 100% remota, aberta a candidatos no Brasil (contractor, PJ, Deel, Remote.com etc.)

fontes:
  # Ordem de prioridade. Sempre que possível, o link enviado é o da página de carreiras
  # da própria empresa (Gupy, Lever, Greenhouse, InHire, Sólides, Recrutei), não o do agregador.
  nacionais:
    - api.remotar.com.br/jobs        # só vagas remotas, traz data e o link de carreira da empresa
    - nerdin.com.br/vagas.php        # nicho de TI, mostra a idade da vaga e o salário
    - programathor.com.br/jobs       # nicho de TI, marca o porte (pequena/média, startup)
    - api.lever.co/v0/postings/<empresa>          # páginas de carreira com data de criação
    - boards-api.greenhouse.io/v1/boards/<empresa>/jobs
    - <empresa>.gupy.io              # páginas de carreira na Gupy, achadas por busca na web
    - glassdoor.com.br               # mostra a idade da vaga, usado para validar os 7 dias
    - br.indeed.com                  # último recurso, não mostra a data
  internacionais:
    - remoteok.com
    - weworkremotely.com
    - remotive.com
    - wellfound.com
    - himalayas.app
  inacessiveis:                      # testados em 13/10/2026, só carregam com JavaScript ou bloqueiam leitura
    - linkedin.com/jobs
    - coodesh.com
    - trampos.co
    - inhire.app (a página da vaga; o link ainda pode ser enviado)
    - github.com/*/vagas

relatorio_semanal:
  dia_semana: sexta-feira
  formato: txt anexado ao e-mail do dia
  conteudo: requisitos mais pedidos nas vagas enviadas de segunda a sexta (contagem e porcentagem),
    separados por área, mais sugestões do que estudar primeiro
  fonte_dos_dados: data/sent_jobs.json (cada vaga guarda área e requisitos)

regras_de_exclusao:
  - vaga já enviada antes (ver data/sent_jobs.json)
  - título ou descrição indicando híbrido/presencial
  - nível pleno/sênior, ou exigência acima de 2 anos de experiência
  - vaga exclusiva para PcD (vagas afirmativas não exclusivas entram, sinalizadas)
  - vagas sem data de publicação confirmada só entram se faltarem vagas, marcadas como "data não confirmada"
